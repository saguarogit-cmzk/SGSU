# Kea keeps its leases and host reservations in PostgreSQL, but the packaged
# unit orders itself against nothing but network-online.target. It therefore
# starts before the database is listening and dies with DHCP4_INIT_FAIL, leaving
# the appliance handing out no leases at all until someone restarts it by hand.
#
# This went unnoticed while systemd-networkd-wait-online blocked the boot for its
# full two-minute timeout, which incidentally gave PostgreSQL all the time it
# needed. Making the boot fast is what exposed it.
[Unit]
After=postgresql.service
Wants=postgresql.service
# A database that is merely slow must not cost the appliance its DHCP service,
# so keep retrying instead of giving up. StartLimitIntervalSec=0 disables the
# rate limiter that would otherwise stop the retries after a few quick failures
# -- the failure this guards against is exactly a burst of fast failures. It
# belongs in [Unit]: systemd ignores it under [Service] with only a log line.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
