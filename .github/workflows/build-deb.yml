name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt (formatting)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: node --check (embedded web assets)
        run: node --check cmd/saguaro/web/app.js
      - name: shellcheck (root adapters + installer)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          # Only hard errors fail the build (not style nits) so the root-privileged
          # adapters and the installer are gated against real shell bugs.
          shellcheck --severity=error scripts/saguaro-* scripts/*.sh
      - name: nftables ruleset syntax (generated ruleset vs real nft parser)
        run: |
          sudo apt-get install -y nftables
          # nft -c needs CAP_NET_ADMIN, so run this one test under sudo with the
          # runner's PATH (for the go toolchain) preserved. The test skips itself
          # if nft is unprivileged, so sudo is what makes it actually run in CI.
          sudo env "PATH=$PATH" go test ./internal/adapters/nftgen/ -run TestGeneratedRulesetParses -v

  test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  deb:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build .deb
        run: |
          version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build-deb.sh --arch "${{ matrix.arch }}" --skip-tests \
            ${version:+--version "$version"}
      - uses: actions/upload-artifact@v4
        with:
          name: saguaro-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: saguaro-deb-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
